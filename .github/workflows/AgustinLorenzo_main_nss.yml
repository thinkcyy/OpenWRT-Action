name: AgustinLorenzo_main_nss

on:
   workflow_dispatch:

env:
  OP_REPO: AgustinLorenzo/openwrt
  REPO_BRANCH: main_nss
  REPO_TYPE: zhKong
  CKOUTPATH: ckout

jobs:
  check:
    outputs:      
      LAST_TAG: ${{ steps.check.outputs.LAST_TAG }}
    runs-on: ubuntu-22.04
    steps:

    - name: Checkout
      uses: actions/checkout@v4
      with:
         path: "${{ env.CKOUTPATH }}"
         
    - id: check
      name: Check for OP repo update
      env:
        OP_REPO: ${{ env.OP_REPO }}
        REPO_BRANCH: ${{ env.REPO_BRANCH }}
      run: | 
        sudo timedatectl set-timezone "Asia/Shanghai"
        git config --global log.date iso-local
        git config --global user.email "action@github.com"
        git config --global user.name "action"
        echo 下载源仓库
        git clone https://github.com/$OP_REPO $([[ $REPO_BRANCH != 'n' ]] && echo "-b $REPO_BRANCH --single-branch")  ./openwrt
        #echo 获取最新提交日期
        cd ./openwrt

        # 获取最新的非mesh的tag
        LAST_NON_MESH_TAG=$(git tag -l --sort=-creatordate | grep -v mesh | head -n 1)
        LAST_NON_MESH_TAG_HASH=$(git show-ref --tags $LAST_NON_MESH_TAG --hash)
        LAST_NON_MESH_TAG_DATE=$(git log --pretty=format:"%cd" --date=format:"%Y-%m-%d %H:%M:%S" $LAST_NON_MESH_TAG_HASH -1) 
        
        echo 最新的非mesh标签为：$LAST_NON_MESH_TAG
        echo 对应的commit为：$LAST_NON_MESH_TAG_HASH
        echo 对应的日期为：$LAST_NON_MESH_TAG_DATE
        echo 当前的日期为：$(date +"%Y-%m-%d %H:%M:%S")

        echo "LAST_TAG=$LAST_NON_MESH_TAG" >> $GITHUB_OUTPUT

  build:
    runs-on: ubuntu-22.04
    needs: check
    steps:                   

    - name: Initialization
      uses: thinkcyy/Action_Initialization@main                
                   
    - name: Prepare
      uses: thinkcyy/Action_OpenWrt_composite@prepare
      with:           
           REPO_BRANCH: ${{needs.check.outputs.LAST_TAG}}
           COMPILE_CONFIG_BASE: qualcommax_ipq807x-202506
           COMPILE_CONFIG_DIFF: "common.cust.package-1-OpenWrt_Component common.cust.package-2-luci_app common.cust.package-3-netfilter"
           # COMPILE_CONFIG_AUTOMERGE: common.cust.package
           COMPILE_CONFIG: common.cust.package-4-nss
           IMAGEBUILDER: y
           # REPLACE_IB: y
           CUSTOM_FEEDS_SH: custom_feeds-AgustinLorenzo
           REPO_TYPE: zhKong
           OP_REPO: AgustinLorenzo/openwrt

    - name: Modify config
      uses: thinkcyy/Action_OpenWrt_composite@config_add
      with:
           # CONFIG_TO_ADD: "CONFIG_ALL_KMODS=y"
           CONFIG_TO_DEL: "CONFIG_PACKAGE_kmod-nft-netdev CONFIG_PACKAGE_kmod-macvlan"
                      
    - name: Download package sources
      working-directory: ${{ github.workspace }}/runner_root/openwrt
      run: make download V=s

    - name: Build tools
      working-directory: ${{ github.workspace }}/runner_root/openwrt
      run: |
        make tools/install -j$(nproc) V=s || \
        make tools/install V=s
        
    - name: Build toolchain
      working-directory: ${{ github.workspace }}/runner_root/openwrt
      run: |
        make toolchain/install -j$(nproc) V=s || \
        make toolchain/install V=s

    - name: Build target images
      working-directory: ${{ github.workspace }}/runner_root/openwrt
      run: |
       make -i -j$(nproc) V=s || make -i V=s
       # make -j$(nproc) V=s || make V=s

    - name: Upload
      uses: thinkcyy/Action_OpenWrt_composite@release
      
    - name: Create release
      uses: ncipollo/release-action@main
      with:
        name: ${{ env.TAG_NAME }}
        allowUpdates: true
        tag: ${{ env.TAG_NAME }}
        replacesArtifacts: true
        token: ${{ secrets.GITHUB_TOKEN }}
        artifacts: ./runner_root/artifact/*           
